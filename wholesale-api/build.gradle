plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.ondo'
version = '0.0.1-SNAPSHOT'
description = 'On도 도매 ERP API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 헬스체크(MUL-76). ALB 가 30초마다 불러서 태스크가 살아있는지 본다
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 프로메테우스 메트릭(MUL-115). local 프로파일만 /actuator/prometheus 를 연다 — application-local.yml
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.1.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	// 규칙 테스트 (Size.valueOf 오용 가드 등) — 바이트코드를 훑어 금지 호출을 빌드에서 잡는다
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

jacoco {
	toolVersion = '0.8.12'   // Java 21 지원
}

tasks.named('test') {
	useJUnitPlatform()

	// 측정용 테스트는 평소에 안 돈다 (MUL-143). 스레드를 여럿 띄우고 결과를 파일로
	// 내보내는 측정이라 일반 테스트와 섞이면 안 된다. 켜려면 -Dmeasure=true 를 준다.
	//
	//   ./gradlew test --tests '*Measurement*' -Dmeasure=true
	//
	// 그레이들은 시스템 속성을 테스트 JVM 에 자동으로 안 넘긴다. 필요한 것만 넘긴다
	if (System.getProperty('measure') != null) {
		systemProperty 'measure', System.getProperty('measure')
	}

	// 테스트 JVM 을 KST 로 고정한다 (MUL-105).
	//
	// 기간 필터는 운영 코드가 한국 날짜를 전제한다 — KstDays 가 Asia/Seoul 로
	// 하루 경계를 잡는다. 그런데 테스트가 LocalDate.now() 를 쓰면 JVM 기본
	// 시간대를 따라가서, 둘이 어긋나는 환경에서만 깨진다.
	//
	// 팀 노트북이 전부 KST 라 안 보였다. GitHub 러너는 UTC 다. UTC 로 15시가
	// 넘으면 한국은 이미 다음 날이라 LocalDate.now() 가 하루 어긋나고,
	// OrderSummaryReaderTest 의 기간 단언이 실패한다 — 하루 중 9시간만 깨지는
	// 형태라 원인 찾기가 나쁘다.
	//
	// db/compose.yml 이 TZ: Asia/Seoul 로 맞춰 둔 것과 같은 이유다
	systemProperty 'user.timezone', 'Asia/Seoul'

	finalizedBy tasks.named('jacocoTestReport')   // 테스트 후 리포트 자동 생성
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true    // CI/커버리지 서비스용
		html.required = true   // 사람이 볼 용도
	}
	// 커버리지 통계에서 제외: 부트스트랩 진입점 (게이트는 아직 없음, 리포트 왜곡 방지)
	def excluded = [
		'com/ondo/wholesale/WholesaleApiApplication.class'
	]
	classDirectories.setFrom(
		files(classDirectories.files.collect {
			fileTree(dir: it, exclude: excluded)
		})
	)
}
