spring:
  application:
    name: wholesale-api
  profiles:
    default: local

    # 배포는 프로필 둘을 켠다 (MUL-104) — 태스크 정의가 순서대로 준다 (MUL-103).
    #
    #   SPRING_PROFILES_ACTIVE=deploy,dev    application-deploy.yml + application-dev.yml
    #   SPRING_PROFILES_ACTIVE=deploy,prod   application-deploy.yml + application-prod.yml
    #
    # 공통을 이 파일(application.yml)에 못 두는 이유 - 여긴 로컬도 읽는다.
    # ${DB_URL} 같은 걸 넣으면 로컬에서 그 환경변수가 없어 앱이 안 뜬다.
    #
    # 전에는 여기 profiles.group 으로 deploy 를 붙였다. 뺀 이유 - 그룹은 deploy 를
    # 뒤에 놓는데 스프링은 뒤에 켜진 프로필이 이긴다. 그래서 deploy 값을 dev/prod 가
    # 못 덮었다. 실제로 같은 값을 양쪽에 넣고 띄워 확인했다.
    #
    # 이제 순서를 태스크 정의(infra/ecs.tf)가 정한다. deploy 가 앞, 환경이 뒤다 -
    # 아래가 깔고 위가 덮는다.
    #
    # deploy 를 빠뜨리면 ${DB_URL} 이 안 들어와 기동에 실패한다. 조용히 잘못
    # 도는 게 아니라 시끄럽게 죽는다.
  flyway:
    default-schema: wholesale   # 이력 테이블(flyway_schema_history)이 여기 생긴다
    out-of-order: true          # 병렬 작업(V7 재고·V8 출고)이 어느 순서로 머지돼도 적용되게
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 마이그레이션이 만든다. 엔티티와 어긋나면 앱이 안 뜬다
    open-in-view: false
    properties:
      hibernate:
        default_schema: wholesale   # common 테이블은 @Table(schema = "common") 을 따로 붙인다
  session:
    jdbc:
      table-name: wholesale.spring_session
      initialize-schema: never   # 테이블은 Flyway 가 만든다. 스프링이 손대지 않는다
server:
  port: 8081                  # 소매가 8080 이라 겹치지 않게
  servlet:
    session:
      timeout: 2h             # 미확정(MUL-69). 인프라 협의 전까지 소매와 같은 값으로 둔다
      cookie:
        name: SESSION_WHOLESALE   # 배포하면 소매와 API 도메인을 같이 쓴다. 이름이 같으면 서로 덮어쓴다
        http-only: true           # 자바스크립트가 못 읽는다. XSS 로 세션을 훔칠 수 없다
        same-site: lax
        secure: false             # 로컬은 http 다. 배포 프로필에서 true 로 덮는다
        path: /

# 헬스체크(MUL-76). ALB 가 30초마다 불러서 이 태스크에 트래픽을 보낼지 정한다
management:
  endpoints:
    web:
      exposure:
        include: health   # health 만 연다. 인터넷에 열리는 주소라 나머지는 닫아 둔다
  endpoint:
    health:
      # liveness · readiness 주소가 따로 생긴다.
      # ALB 는 liveness 를 보고, DB 상태는 health 로 본다.
      # ALB 에 DB 를 물리면 DB 장애 때 ECS 가 태스크를 죽이고 다시 띄우는데,
      # 새로 띄워도 DB 는 그대로라 재시작만 반복한다. 그걸 막으려고 가른다.
      probes:
        enabled: true
      show-details: never   # {"status":"UP"} 만 나간다. DB 종류·디스크 용량이 새지 않게

# 소매 접점 시크릿 (MUL-87). 소매 백엔드가 X-Ondo-Gateway-Secret 헤더로 실어 보낸다.
#
# 로컬은 비워 둔다 — 값이 없으면 검사를 생략한다. 도매·소매를 각자 띄워 쓰는
# 팀원들이 시크릿을 맞추지 않아도 돌아가야 해서다.
#
# 배포는 application-prod.yml 이 기본값 없이 환경변수를 요구한다. 값이 없으면
# 앱이 아예 안 뜬다 — 시크릿을 빠뜨린 채 소매 접점이 열려 있는 것보다,
# 배포가 실패하고 ECS 가 되돌리는 편이 낫다.
ondo:
  gateway:
    secret: ""

  settlement:
    ledger:
      # 미수 잔액을 동시 쓰기로부터 지키는 방법 (MUL-143).
      #
      #   NONE         아무것도 안 한다. 깨지는 것을 보여주는 측정 전용
      #   OPTIMISTIC   버전으로 검사하고 충돌하면 다시 한다
      #   PESSIMISTIC  거래처 행을 FOR UPDATE 로 잠가 한 줄로 세운다
      #
      # 측정 결과 비관적을 골랐다. 같은 거래처에 동시 640건을 넣었을 때
      # 잠금 없음은 잔액의 89%가 증발했고, 낙관적은 정확하지만 4,556번 재시도하고도
      # 1건을 끝내 못 넣었다. 비관적은 정확하면서 잠금 없는 것보다 38ms 느릴 뿐이다.
      # 잠금 안에서 원장 쓰기 말고 아무것도 안 하기 때문이다 — 여기서 외부 호출을
      # 하면 이 숫자가 뒤집힌다. 근거: load/settlement/README.md
      strategy: PESSIMISTIC
