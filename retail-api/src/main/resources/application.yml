spring:
  application:
    name: retail-api
  profiles:
    default: local

    # 배포는 프로필 둘을 켠다 (MUL-104) — 태스크 정의가 순서대로 준다 (MUL-103).
    #
    #   SPRING_PROFILES_ACTIVE=deploy,dev    application-deploy.yml + application-dev.yml
    #   SPRING_PROFILES_ACTIVE=deploy,prod   application-deploy.yml + application-prod.yml
    #
    # 공통을 이 파일(application.yml)에 못 두는 이유 — 여긴 로컬도 읽는다.
    # ${DB_URL} 같은 걸 넣으면 로컬에서 그 환경변수가 없어 앱이 안 뜬다.
    #
    # 전에는 여기 profiles.group 으로 deploy 를 붙였다. 뺀 이유 — 그룹은 deploy 를
    # 뒤에 놓는데 스프링은 뒤에 켜진 프로필이 이긴다. 그래서 deploy 값을 dev/prod 가
    # 못 덮었다. 실제로 같은 값을 양쪽에 넣고 띄워 확인했다.
    #
    # 이제 순서를 태스크 정의(infra/ecs.tf)가 정한다. deploy 가 앞, 환경이 뒤다 —
    # 아래가 깔고 위가 덮는다.
    #
    # deploy 를 빠뜨리면 ${DB_URL} 이 안 들어와 기동에 실패한다. 조용히 잘못
    # 도는 게 아니라 시끄럽게 죽는다.
  flyway:
    default-schema: retail    # 이력 테이블(flyway_schema_history)이 여기 생긴다

    # 번호가 뒤늦게 와도 적용한다 (MUL-98).
    #
    # 개발 환경 시드가 db/seed 의 V900 으로 먼저 들어가 있다(MUL-110). 그 뒤에
    # V4 를 새로 내면 Flyway 는 "적용 안 된 옛 번호" 로 보고 기동을 막는다.
    # 도매도 같은 이유로 켜져 있다 — 채빈이 병렬 작업 때문에 먼저 켰다.
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 마이그레이션이 만든다. 엔티티와 어긋나면 앱이 안 뜬다
    open-in-view: false
    properties:
      hibernate:
        default_schema: retail
  session:
    jdbc:
      table-name: retail.spring_session
      initialize-schema: never   # 테이블은 Flyway 가 만든다. 스프링이 손대지 않는다

springdoc:
  swagger-ui:
    enabled: false   # 화면은 Scalar 를 쓴다(/docs). JSON 생성만 springdoc 이 한다

  # 기본값 /v3/api-docs 에서 옮겼다 (MUL-110).
  #
  # 배포에서 문서를 열 때 도매·소매가 같은 ALB 뒤에 있는데, 둘 다 /v3/api-docs 를
  # 쓰고 있었다. ALB 는 경로로 가르니 한 곳으로만 보낼 수 있고, 그러면 도매 문서를
  # 열어도 소매 스펙이 그려진다.
  #
  # 도매가 아니라 소매를 옮긴 건 도매가 채빈 영역이어서다. 화면(/docs)과
  # 도매 주소(/docs.html · /v3/api-docs)는 안 건드린다.
  api-docs:
    path: /v3/api-docs-retail

server:
  servlet:
    multipart:
      max-file-size: 10MB       # 명세상 사업자등록증 10MB. 스프링 기본값은 1MB 다
      max-request-size: 12MB    # 파일 + payload 를 합친 상한
    session:
      timeout: 2h               # 미정 상태다(숙제.md). 새벽 영업이라 짧으면 작업 중에 튕긴다
      cookie:
        name: SESSION_RETAIL    # 도매와 API 도메인을 같이 써서 이름이 같으면 서로 덮어쓴다
        http-only: true         # 자바스크립트가 못 읽는다. XSS 로 세션을 훔칠 수 없다
        same-site: lax
        secure: false           # 로컬은 http 다. 배포 프로필에서 true 로 덮는다
        path: /

# 헬스체크(MUL-76). ALB 가 30초마다 불러서 이 태스크에 트래픽을 보낼지 정한다
management:
  endpoints:
    web:
      exposure:
        include: health   # health 만 연다. 인터넷에 열리는 주소라 나머지는 닫아 둔다
  endpoint:
    health:
      # liveness · readiness 주소가 따로 생긴다.
      # ALB 는 liveness 를 보고, DB 상태는 health 로 본다.
      # ALB 에 DB 를 물리면 DB 장애 때 ECS 가 태스크를 죽이고 다시 띄우는데,
      # 새로 띄워도 DB 는 그대로라 재시작만 반복한다. 그걸 막으려고 가른다.
      probes:
        enabled: true
      show-details: never   # {"status":"UP"} 만 나간다. DB 종류·디스크 용량이 새지 않게

# 도매 서버 (MUL-88). 상품·미송·주문이 전부 이 주소로 나간다.
#
# 소매 DB 에는 상품이 없다. 도매가 안 뜨면 상품 화면이 못 뜬다 — 그래서 타임아웃을
# 반드시 준다. 안 주면 무한 대기라 도매가 느린 동안 소매 톰캣 스레드가 하나씩 잠기고,
# 도매 장애가 소매 전체 장애로 번진다.
#
# 기본값은 로컬이다. 배포는 application-deploy.yml 이 환경변수로 덮는다 (MUL-87).
ondo:
  wholesale:
    base-url: http://localhost:8081
    connect-timeout: 2s    # 연결까지. 도매가 아예 안 떠 있으면 여기서 끊긴다
    read-timeout: 5s       # 응답까지. 받아놓고 안 주는 경우를 끊는다

    # 소매 접점 시크릿 (MUL-87). 로컬은 비워 둔다 — 도매도 값이 없으면 검사를
    # 생략하므로 짝이 맞는다. 팀원들이 시크릿을 맞추지 않아도 로컬이 돌아간다
    secret: ""

  order:
    dispatch:
      # 도매가 안 떠서 못 넣은 주문을 얼마나 붙잡고 다시 시도할지 (MUL-139).
      #
      # 실제 기한은 이 값과 영업일 경계(KST 12시) 중 이른 쪽이다. 경계를 넘기면
      # 어제 주문이 오늘 주문으로 집계돼 소매 화면과 도매 장부의 날짜가 어긋난다.
      #
      # 길게 잡으면 그동안 소매처가 다른 도매에서 살 기회를 뺏는 셈이라, 결국 못
      # 넣으면 손해가 커진다. 짧으면 재시도할 틈이 없어 기능이 무의미해진다.
      max-wait: 30m

      # 워커를 주기적으로 깨울지 (MUL-140). 테스트는 꺼 두고 직접 부른다 —
      # 배경 워커와 경합하면 결과가 흔들린다
      scheduler-enabled: true

      # 워커가 대기함을 들여다보는 주기. 평소엔 PENDING 이 0 건이라
      # 부분 인덱스만 스쳐 지나간다
      poll-interval: 1s

      # 한 바퀴에 집는 최대 건수. 도매가 막 살아난 순간 밀린 것을 통째로 쏟아부으면
      # 다시 쓰러뜨린다
      batch-size: 50

      # 집어 두고 이만큼은 다른 워커가 못 건드린다. 도매 타임아웃(연결 2s + 응답 5s)
      # 보다 넉넉해야 한 주문을 두 번 부르지 않는다. 호출이 끝나면 결과에 따라 진짜
      # 다음 시각으로 다시 쓰므로 재시도 간격을 늘리지는 않는다
      claim-timeout: 15s

      retry:
        # FIXED · EXPONENTIAL · EXPONENTIAL_JITTER
        #
        # 지수만으로는 몰림이 안 풀린다 — 같은 순간에 실패한 건들이 같은 곡선을 타서
        # 같은 순간에 깨어난다. 지터가 그걸 흩뜨린다 (MUL-142 에서 셋을 비교한다)
        policy: EXPONENTIAL_JITTER
        base-delay: 1s
        max-delay: 60s
        jitter-ratio: 0.2
        max-attempts: 10
